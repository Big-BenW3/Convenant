[package]
name = "convenant"
version = "0.1.0"
description = "Private trading negotiation escrow on Solana via MagicBlock Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "convenant"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = ["anchor-lang/anchor-debug"]
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
sha2 = "0.10"
solana-program = "3"
ephemeral-rollups-sdk = { version = "0.17.0", features = ["anchor", "access-control"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-account = "3.2.0"
solana-sdk = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }